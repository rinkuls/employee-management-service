
<div class="login-container">
  <!-- Main Heading -->
  <h1 class="main-heading">
    Employee Management Tool
  </h1>

  <!-- Logo in the top-right corner -->
  <div class="logo">
    <div class="circle">
      <marquee direction="left" behavior="scroll" scrollamount="4">
        Ankit Computer GmbH
      </marquee>
    </div>
  </div>

  <!-- Info Text -->
  <div class="info-text">
    <marquee direction="left" behavior="scroll" scrollamount="6">
      <span class="stars">****</span>
      For more information, contact us at <strong>info.ankit.computer&#64;gmail.com</strong>
      <span class="stars">****</span>
    </marquee>
  </div>

  <!-- Login Form -->
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
        required
        (input)="validateUsername()"
        title="Username should only contain alphabets."
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
        (input)="validatePassword()"
        title="Password should not contain spaces."
      />
    </div>

    <div class="form-group">
      <label for="empId">Employee ID</label>
      <input
        type="text"
        id="empId"
        name="empId"
        [(ngModel)]="empId"
        required
        (input)="validateEmpId()"
        title="Employee ID should be a long numeric value."
      />
    </div>

    <button type="submit" class="login-button">Login</button>
  </form>
</div>

<!-- Footer Text -->
<div class="footer-text">
  <marquee direction="left" behavior="scroll" scrollamount="6">
    <span class="stars">*****</span>
    Ankit Computers GmbH Welcomes You
    <span class="stars">*****</span>
  </marquee>
</div>

<!-- Background Overlay Text -->
<div class="background-overlay">
  New Launch!
</div>
