# PostgreSQL Database Configuration (For Docker Compose and Production)
spring.datasource.url=jdbc:postgresql://db:5432/user_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.platform=postgresql
# Hibernate Dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable H2 Configuration (make sure no H2-related configurations are active in prod)
spring.h2.console.enabled=false
# JPA Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
