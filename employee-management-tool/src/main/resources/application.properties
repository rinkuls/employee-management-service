# Application Name and Port
spring.application.name=employee-management-tool
server.port=8071
# Freemarker Configuration
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.cache=false
# Hibernate and SQL Configuration
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.ddl-auto=none
# Spring MVC Configuration
spring.mvc.pathmatch.matching-strategy=path-pattern-parser
# General SQL Initialization (can be overridden in environment-specific files)
spring.datasource.initialization-mode=always
spring.datasource.initialize=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.show_sql=true
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# JWT configuration
# URL to the private secret key in GitHub
jwt.secret.url=https://raw.githubusercontent.com/rinkuls/myProkectKey/main/jwtSecret.txt
jwt.expiration=3600000
jwt.expected-issuer=myAuthService
jwt.expected-audience=employeeManagementTool
