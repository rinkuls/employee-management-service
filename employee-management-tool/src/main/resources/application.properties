# =======================
# Application Configuration
# =======================
spring.application.name=employee-management-tool
server.port=8071

# =======================
# Freemarker Configuration
# =======================
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.cache=false

# =======================
# Logging Configuration
# =======================
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
logging.level.org.springframework.security=TRACE

# =======================
# Database Configuration
# =======================
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db?options=-c%20search_path=user_schema,employee_schema
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.platform=postgresql

# =======================
# Hibernate & JPA Configuration
# =======================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =======================
# Flyway Migration Configuration
# =======================
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/user_db
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=user_schema,employee_schema
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-on-validation-error=true
spring.flyway.out-of-order=true

# =======================
# Security Configuration
# =======================
security-config.allowed-paths=/h2/**,/swagger-ui/**,/v3/api-docs/**
security-config.cors.allowed-origins=http://localhost:4200

# =======================
# OAuth2 & JWT Configuration
# =======================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/employee-management
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/employee-management/protocol/openid-connect/certs

jwt.expiration=3600000
jwt.expected-issuer=myAuthService
jwt.expected-audience=employeeManagementTool

# =======================
# Miscellaneous Configuration
# =======================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.data.rest.enabled=false
spring.data.rest.default-media-type=application/hal+json
spring.data.rest.detection-strategy=ANNOTATED
