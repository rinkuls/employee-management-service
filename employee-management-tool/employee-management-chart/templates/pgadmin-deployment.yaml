apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgadmin
  labels:
    app: {{ .Release.Name }}-pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pgadmin
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pgadmin
    spec:
      containers:
          - name: pgadmin
            image: {{ .Values.pgadmin.image }}
            ports:
              - containerPort: 80
            env:
              - name: PGADMIN_DEFAULT_EMAIL
                value: {{ .Values.pgadmin.email }}
              - name: PGADMIN_DEFAULT_PASSWORD
                value: {{ .Values.pgadmin.password }}
            volumeMounts:
              - name: pgadmin-data
                mountPath: /var/lib/pgadmin
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pgadmin-pvc
