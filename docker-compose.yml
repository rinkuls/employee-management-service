services:
  app:
    build:
      context: ./employee-management-tool
      dockerfile: Dockerfile
    container_name: 'employee-management-tool'
    ports:
      - '8071:8071'
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/employee_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db
      - logstash
    networks:
      - common-net

  ui:
    build:
      context: ./employee-management-tool-ui
      dockerfile: Dockerfile
    container_name: 'employee-management-ui'
    ports:
      - '4200:80'
    networks:
      - common-net
    depends_on:
      - app
  db:
    image: postgres:15
    container_name: 'postgres-db'
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - common-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: 'pgadmin'
    environment:
      PGADMIN_DEFAULT_EMAIL: rinkulsharma123@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - db
    networks:
      - common-net

  elasticsearch: # configures the Elasticsearch container.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    container_name: 'elasticsearch'
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - common-net

  logstash: #c onfigures the Logstash container.
    image: docker.elastic.co/logstash/logstash:8.9.2
    container_name: 'logstash' # Sets the name of the container to "logstash."
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - /logs/sample.log:/usr/share/logstash/data/sample.log  add your log file path to here
      - ./logs:/usr/share/logstash/logs
    ports:
      - 5000:5000
    environment:
      - 'LS_JAVA_OPTS=-Xmx256m -Xms256m' # Sets the Java options for Logstash heap size.
    networks:
      - common-net
    depends_on:
      - elasticsearch

  kibana: # Configures the Kibana container.
    image: docker.elastic.co/kibana/kibana:8.9.2
    container_name: 'kibana' # Sets the name of the container to "kibana."
    ports:
      - 5601:5601
    environment: # Sets the Elasticsearch URL and Node.js options for the Kibana container.
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - 'NODE_OPTIONS=--max-old-space-size=2048'
    networks:
      - common-net
    depends_on:
      - elasticsearch


networks:
  common-net:
    name: common-net

volumes:
  postgres_data:
  es-data:
    driver: local
